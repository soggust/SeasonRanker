<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600'>
<!-- The octagon's canvas (the page background, tiled): plain off-white canvas (no weave: any regular grid reads as the scoreboard panels), a soft mottling, a fine grain, and a few
     faint stains from the fights on it -->
<defs>
<filter id='mottle'><feTurbulence type='fractalNoise' baseFrequency='0.012' numOctaves='3' seed='3'/><feColorMatrix values='0 0 0 0 0.45  0 0 0 0 0.4  0 0 0 0 0.34  0 0 0 0.22 0'/></filter>
<filter id='grain'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' seed='8'/><feColorMatrix values='0 0 0 0 0.3  0 0 0 0 0.27  0 0 0 0 0.24  0 0 0 0.14 0'/></filter>
<filter id='soft'><feGaussianBlur stdDeviation='10'/></filter>
</defs>
<rect width='600' height='600' fill='#e9e4da'/>
<rect width='600' height='600' filter='url(#mottle)'/>
<rect width='600' height='600' filter='url(#grain)'/>
<circle cx='5' cy='58' r='76' fill='#8a6b52' fill-opacity='0.057' filter='url(#soft)'/><circle cx='428' cy='170' r='58' fill='#8a6b52' fill-opacity='0.031' filter='url(#soft)'/><circle cx='593' cy='146' r='66' fill='#8a6b52' fill-opacity='0.061' filter='url(#soft)'/><circle cx='472' cy='482' r='44' fill='#8a6b52' fill-opacity='0.041' filter='url(#soft)'/><circle cx='544' cy='391' r='24' fill='#8a6b52' fill-opacity='0.042' filter='url(#soft)'/>
</svg>