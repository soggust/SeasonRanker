<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600'>
<!-- The octagon's canvas (the page background, tiled): plain off-white canvas (no weave: any regular grid reads as the scoreboard panels), a soft mottling, and a fine grain, both stitched so the tile repeats
     without a seam (the stains are the ground paint's) -->
<defs>
<filter id='mottle' x='0' y='0' width='100%' height='100%'><feTurbulence type='fractalNoise' baseFrequency='0.012' numOctaves='3' seed='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.45  0 0 0 0 0.4  0 0 0 0 0.34  0 0 0 0.22 0'/></filter>
<filter id='grain' x='0' y='0' width='100%' height='100%'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' seed='8' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.3  0 0 0 0 0.27  0 0 0 0 0.24  0 0 0 0.14 0'/></filter>
</defs>
<rect width='600' height='600' fill='#e9e4da'/>
<rect width='600' height='600' filter='url(#mottle)'/>
<rect width='600' height='600' filter='url(#grain)'/>
</svg>