<!-- The heat maps' bar: season, split, side, mode, and the opponent's overlay -->
<div class="hm-controls">
  @if (seasons.length > 1) {
    <label class="hm-season">
      <span class="hm-visually-hidden">Season</span>
      <select [value]="season" (change)="pickSeason($any($event.target).value)">
        @for (s of seasons; track s) {
          <option [value]="s" [selected]="s === season">{{ seasonText(s) }}</option>
        }
      </select>
    </label>
  }
  @if (splits.length > 1) {
    <span class="hm-group" role="group" aria-label="Split">
      @for (sp of splits; track sp.id) {
        <button type="button" class="game-filter small" [class.active]="sp.id === split" [attr.aria-pressed]="sp.id === split" [title]="sp.title ?? ''" (click)="splitChange.emit(sp.id)">{{ sp.label }}</button>
      }
    </span>
  }
  @if (sides && sides.length > 1) {
    <span class="hm-group" role="group" aria-label="Side of the ball">
      @for (sd of sides; track sd.id) {
        <button type="button" class="game-filter small" [class.active]="sd.id === side" [attr.aria-pressed]="sd.id === side" [title]="sd.title ?? ''" (click)="sideChange.emit(sd.id)">{{ sd.label }}</button>
      }
    </span>
  }
  @if (showMode) {
    <span class="hm-group" role="group" aria-label="Color by">
      @for (m of modes; track m.id) {
        <button type="button" class="game-filter small" [class.active]="m.id === mode" [attr.aria-pressed]="m.id === mode" [title]="m.title" (click)="modeChange.emit(m.id)">{{ m.label }}</button>
      }
    </span>
  }
  @if (opponent) {
    <button
      type="button"
      class="game-filter small hm-vs"
      [class.active]="overlay"
      [attr.aria-pressed]="overlay"
      [title]="overlayTitle"
      (click)="overlayChange.emit(!overlay)"
    >
      vs {{ opponent.label }}
    </button>
  }
</div>
