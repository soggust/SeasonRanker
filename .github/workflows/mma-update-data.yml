name: MMA - Update Game Data

on:
  schedule:
    # Nightly at 12:07 UTC (7:07 AM CDT): after a night's card is final.
    # The 14:37 UTC run is a backup for a delayed or
    # dropped one; a run with nothing new is a no-op (no commit, no deploy).
    - cron: "7 12 * * *"
    - cron: "37 14 * * *"
  workflow_dispatch:

# One update of this sport at a time: a run that starts while another is still going waits for it. Each sport
# its own queue (update-data-<sport>): GitHub keeps one waiting run a group and a newer one cancels it, so in one
# queue for every sport a sport's waiting run could be dropped for another's. They write apart (each its own
# apps/<sport>), their pushes rebase onto each other's, and their deploys wait in one queue (deploy.yml)
concurrency:
  group: update-data-mma
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    # (a hung source stops the run, not six hours: the runs take 1-15 minutes)
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        # (the branch as it is when the job starts, not the commit it was queued at: a run that waited behind
        # another would start from data that run already moved on from, and its commit couldn't rebase)
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Pull MMA fights and stats
        run: npm run mma:update-data

      # The card's Heat Maps: every UFC bout's strikes by target and position and its grappling (ESPN's core
      # API, each bout asked once and kept in scripts/strikes), and when every fight ended, binned by division (a
      # failure keeps yesterday's files)
      - name: Build heat maps
        run: node apps/mma/scripts/build-heat-maps.mjs || echo "heat maps skipped"

      # (the data checked before it's committed: a broken file stays out of master and off the site; npm test)
      - name: Install dependencies
        # (npm install, not npm ci: GitHub's npm wants lock entries ours resolves without; the lock is put back
        # as it was, so the commit step's pull --rebase sees a clean tree)
        uses: ./.github/actions/npm-install

      - name: Check the data
        # Whether the data is whole (data.test.mjs: it parses, every file and row has its fields) blocks the commit.
        # The rest of the suite checks the code, which ci.yml already gated on the push: run here on the night's
        # fresh data, a test that's too strict for it is a warning on the run's page, not a lost update (two such
        # failed the NFL and MLB updates on 2026-10-16). tests/support/live.mjs's checks warn as before
        env:
          LIVE_DATA_SOFT: "1"
        run: |
          node --test tests/data.test.mjs
          if ! npm test > test-run.log 2>&1; then
            grep -E "^not ok" test-run.log | sed "s/^/::warning::a code test failed on this run's data (not blocking): /" || true
            tail -n 40 test-run.log
          fi

      - name: Commit updated data
        id: commit
        run: |
          git add apps/mma/src/StaticData apps/mma/scripts/cache.json apps/mma/scripts/fights apps/mma/scripts/strikes
          if git diff --cached --quiet; then
            echo "No data changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update MMA data"
          # (the model desk pushes hourly: a push that loses the race rebases onto it and tries again, three times)
          for attempt in 1 2 3; do
            if git pull --rebase --autostash && git push; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # (a rebase that stopped on a conflict let go of, so the next try starts clean)
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 10))
          done
          exit 1

      # (no build or deploy while MMA is dev-only: npm run build leaves it out, so a deploy from here would
      # carry nothing new; when it launches, add ng build mma to the build and the deploy steps back, as in
      # the other sports' workflows)
