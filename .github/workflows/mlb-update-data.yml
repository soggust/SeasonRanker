name: MLB - Update Game Data

on:
  schedule:
    # Nightly at 10:33 UTC (5:33 AM CDT): after the last West Coast games are final and the MLB Stats
    # API and Baseball Savant have caught up, and clear of the NFL update (they share one queue, see
    # concurrency). The 13:07 UTC run is a backup for a delayed or dropped one; a run with nothing new
    # is a no-op (no commit, no deploy).
    # Then every hour through the day (10:33 to 17:33 UTC): GitHub drops scheduled runs (2026-10-14 it
    # dropped the NHL's two), so the more tries the sooner one lands. This computer's task "QBRanker NFL
    # data kick" (apps/nfl/scripts/kick-update.mjs --sport=mlb) also starts it, off GitHub's timer
    - cron: "33 10-17 * * *"
  workflow_dispatch:

# One update at a time: a run that starts while another is still going waits for it
concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    # (a hung source stops the run, not six hours: the runs take 1-15 minutes)
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        # (the branch as it is when the job starts, not the commit it was queued at: a run that waited behind
        # another would start from data that run already moved on from, and its commit couldn't rebase)
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      # (Baseball Savant's pitches, a day a file, kept between runs: the heat maps' source, read by the rollover's
      # archive and the night's build; a run that misses it asks Savant again, a day at a time)
      - name: Restore the Statcast cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/savant
          key: mlb-savant-${{ github.run_id }}
          restore-keys: mlb-savant-

      # A new season that has begun (yesterday's games on ESPN) becomes current before the night's
      # update: the finished one is archived as a past season (scripts/rollover.mjs)
      - name: Roll over to a new season
        run: node scripts/rollover.mjs mlb --if-due

      # (once the postseason has begun, also the playoffs' and both parts' files, skill-players.post.json
      # and .all.json: the app's Stats From)
      - name: Pull stats from the MLB Stats API and Baseball Savant
        run: npm run mlb:update-data

      # (Wikipedia's coaching staffs: a failed fetch keeps yesterday's file)
      - name: Build coaching staffs
        run: node apps/mlb/scripts/build-coaches.mjs || echo "coaches skipped"

      # The card's Heat Maps: the season's pitches from Baseball Savant a day at a time, binned (every pitch's
      # location, every ball in play's direction, the Outs Above Average boards); at most 20 minutes of asking a
      # run, and a season not all in, or a failure, keeps yesterday's files
      - name: Build heat maps
        run: HEAT_MAPS_MINUTES=20 node apps/mlb/scripts/build-heat-maps.mjs || echo "heat maps skipped"

      # (the days fetched tonight kept even when a later step fails: the next run resumes from them rather than
      # from the last run that got all the way through)
      - name: Save the Statcast cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .cache/savant
          key: mlb-savant-${{ github.run_id }}

      # (the data checked before it's committed: a broken file stays out of master and off the site; npm test)
      - name: Install dependencies
        # (npm install, not npm ci: GitHub's npm wants lock entries ours resolves without; the lock is put back
        # as it was, so the commit step's pull --rebase sees a clean tree)
        run: |
          npm install
          git checkout -- package-lock.json

      - name: Check the data
        run: npm test

      - name: Commit updated data
        id: commit
        run: |
          git add apps/mlb/src/StaticData apps/mlb/scripts/update-data.mjs apps/mlb/src/sport/sport.ts
          if git diff --cached --quiet; then
            echo "No data changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update MLB data"
          # (the model desk pushes hourly: a push that loses the race rebases onto it and tries again, three times)
          for attempt in 1 2 3; do
            if git pull --rebase && git push; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((attempt * 10))
          done
          exit 1

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so deploy here
      - name: Build project
        if: steps.commit.outputs.changed == 'true'
        run: npm run build

      - name: Install Firebase CLI
        if: steps.commit.outputs.changed == 'true'
        run: npm install -g firebase-tools

      - name: Deploy to Firebase
        if: steps.commit.outputs.changed == 'true'
        run: firebase deploy --token ${{ secrets.FIREBASE_TOKEN }}
