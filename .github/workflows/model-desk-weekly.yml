name: Model Desk - Self-check

on:
  schedule:
    # Monday mornings, about 8am Central (13:07 UTC: 8:07 in daylight time, 7:07 in standard), after the
    # weekend's games are graded. GitHub runs scheduled workflows late, sometimes not at all; a missed week is
    # caught up by the next, or run by hand. The weekly self-check (libs/ranker/scripts/model/selfcheck.mjs):
    # free, no AI, no network; it reads each sport's ledger, CHECKs, state and the state's history in git, and
    # writes apps/<sport>/src/StaticData/model/selfcheck.json, which the Algorithm tab shows
    - cron: "7 13 * * 1"
  workflow_dispatch:

# (its own group, not the hourly desk's: GitHub keeps one waiting run a group, so in the desk's group the next
# hourly run could replace a waiting self-check. Its commit rebases onto whatever the desk has pushed meanwhile)
concurrency:
  group: model-selfcheck
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  selfcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # (the whole history: C9 reads the day's last state.json for 35 days, C16 the model files' last commit)
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      # (the desk's cache, read only: the AI usage log (.cache/model/ai-usage.json) the write-ups' check counts
      # the spend from; none there, the check says so. Never saved from here: the hourly desk owns it)
      - name: Restore the desk's cache (read only)
        uses: actions/cache/restore@v6
        with:
          path: .cache/model
          key: model-selfcheck-${{ github.run_id }}
          restore-keys: model-desk-

      # (pure Node, nothing to install; a sport that fails is warned of and skipped, never the others)
      - name: Run the self-check
        run: node libs/ranker/scripts/model/selfcheck.mjs

      # (only the self-check's files, each written only when something but its time changed, so a quiet week
      # commits nothing; a desk run may have pushed meanwhile: rebase and try again, three times)
      - name: Commit the self-check
        id: commit
        run: |
          git add apps/*/src/StaticData/model/selfcheck.json
          if git diff --cached --quiet; then
            echo "Nothing new"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Model desk: weekly self-check"
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep $((attempt * 10))
          done
          exit 1

      # The Algorithm tab reads each sport's data/model/selfcheck.json, served with the site: when it changed,
      # the site is built and deployed (pushes made with GITHUB_TOKEN don't trigger the Firebase deploy
      # workflow, so it's done here, as the desk's run does)
      - name: Install dependencies
        if: steps.commit.outputs.changed == 'true'
        run: |
          npm install
          git checkout -- package-lock.json

      - name: Build project
        if: steps.commit.outputs.changed == 'true'
        run: npm run build

      - name: Install Firebase CLI
        if: steps.commit.outputs.changed == 'true'
        run: npm install -g firebase-tools

      - name: Deploy to Firebase
        if: steps.commit.outputs.changed == 'true'
        run: firebase deploy --token ${{ secrets.FIREBASE_TOKEN }}
