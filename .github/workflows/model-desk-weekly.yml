name: Model Desk - Self-check

on:
  schedule:
    # Monday mornings, about 8am Central (13:07 UTC: 8:07 in daylight time, 7:07 in standard), after the
    # weekend's games are graded. GitHub runs scheduled workflows late, sometimes not at all; a missed week is
    # caught up by the next, or run by hand. The weekly self-check (libs/ranker/scripts/model/selfcheck.mjs):
    # free, no AI, no network; it reads each sport's ledger, CHECKs, state and the state's history in git, and
    # writes apps/<sport>/src/StaticData/model/selfcheck.json, which the Algorithm tab shows
    - cron: "7 13 * * 1"
  workflow_dispatch:

# (its own group, not the hourly desk's: GitHub keeps one waiting run a group, so in the desk's group the next
# hourly run could replace a waiting self-check. Its commit rebases onto whatever the desk has pushed meanwhile)
concurrency:
  group: model-selfcheck
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  selfcheck:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    # (the self-check takes a minute; the residual refit replays the four sports' history, about 15 more)
    timeout-minutes: 45

    steps:
      # (the whole history: C9 reads the day's last state.json for 35 days, C16 the model files' last commit)
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # (the branch as it is when the job starts, not the commit it was queued at)
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      # (the desk's cache, read only: the AI usage log (.cache/model/ai-usage.json) the write-ups' check counts
      # the spend from; none there, the check says so. Never saved from here: the hourly desk owns it)
      - name: Restore the desk's cache (read only)
        uses: actions/cache/restore@v6
        with:
          path: .cache/model
          key: model-selfcheck-${{ github.run_id }}
          restore-keys: model-desk-

      # (pure Node, nothing to install; a sport that fails is warned of and skipped, never the others)
      - name: Run the self-check
        run: node libs/ranker/scripts/model/selfcheck.mjs

      # (the residual model's weekly refit (residual-train.mjs; DECISIONS.md D32): the priced history replayed from
      # the desk's cache the restore brought (the saved fit, the context facts), fit into monthly snapshots and
      # written to apps/<sport>/src/StaticData/model/residual.json behind its hold-out guard (a refit worse than the
      # Book or the shipped file is held at the current price). Failing soft: without the cache a sport is skipped
      # and the job goes on. The files are the gate's challenger (RESID_ON); the flag off, they price nothing)
      - name: Refit the residual model
        run: node --max-old-space-size=6144 libs/ranker/scripts/model/residual-train.mjs --collect --write || echo "the residual refit skipped"

      # (npm install, not npm ci, as the desk's run does: the lock put back. The data test needs it (esbuild),
      # and so does the build)
      - name: Install dependencies
        uses: ./.github/actions/npm-install

      # (the hourly desk's npm test asserts selfcheck.json's shape before it commits: a file that failed it would
      # stop every hourly run's commit. So it's checked here first; failing, the job stops and nothing is committed)
      - name: Check the self-check's data
        run: node --test tests/data.test.mjs

      # (only the self-check's files and the residual model's, each written only when something but its time
      # changed, so a quiet week commits nothing; a desk run may have pushed meanwhile: rebase and try again,
      # three times)
      - name: Commit the self-check
        id: commit
        run: |
          git add apps/*/src/StaticData/model/selfcheck.json apps/*/src/StaticData/model/residual.json
          if git diff --cached --quiet; then
            echo "Nothing new"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Model desk: weekly self-check"
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            # (a rebase that stopped on a conflict let go of, so the next try starts clean)
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 10))
          done
          exit 1

  # (the site built and deployed after the commit, one deploy at a time across every workflow: deploy.yml)
  deploy:
    needs: selfcheck
    if: needs.selfcheck.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
