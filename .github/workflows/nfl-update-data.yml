name: NFL - Update Game Data

on:
  schedule:
    # Nightly at 08:13 UTC (4:13 AM EDT / 3:13 AM CDT): hours after the last night game ends.
    # Off the top of the hour on purpose: GitHub delays and sometimes drops scheduled runs set
    # for :00, when everyone's run at once. The hourly runs after it are retries: the update
    # waits until ESPN's season stats cover every game in its results (update-data.mjs, a run
    # that holds writes nothing), and they also cover a delayed or dropped run. A run with
    # nothing new is a no-op (no commit, no deploy).
    # Then every hour through the morning (08:13 to 16:13 UTC): GitHub has been dropping or delaying this
    # repo's scheduled runs by hours (2026-10-13: neither the 08:13 nor the 10:13 ran), so the more tries
    # the sooner one lands; a run with nothing new is a no-op. This computer's scheduled task "QBRanker
    # NFL data kick" (apps/nfl/scripts/kick-update.mjs) also starts it at 4:30 and 7:30 AM Central, off
    # GitHub's timer altogether
    - cron: "13 8-16 * * *"
  workflow_dispatch:

# One update of this sport at a time: a run that starts while another is still going waits for it. Each sport
# its own queue (update-data-<sport>): GitHub keeps one waiting run a group and a newer one cancels it, so in one
# queue for every sport a sport's waiting run could be dropped for another's. They write apart (each its own
# apps/<sport>), their pushes rebase onto each other's, and their deploys wait in one queue (deploy.yml)
concurrency:
  group: update-data-nfl
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    # (a hung source stops the run, not six hours: the runs take 1-15 minutes)
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        # (the branch as it is when the job starts, not the commit it was queued at: a run that waited behind
        # another would start from data that run already moved on from, and its commit couldn't rebase)
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      # (the finished games' summaries already read, so a run reads only the new ones: update-data.mjs; and
      # nflverse's files, fresh for six hours, so the retry runs don't download them again: build-depth.mjs)
      - name: Restore the download caches
        uses: actions/cache@v6
        with:
          path: |
            .cache/nfl-summaries
            .cache/nflverse
            .cache/highlights
          key: nfl-cache-${{ github.run_id }}
          restore-keys: nfl-cache-

      # A new season that has begun (yesterday's games on ESPN) becomes current before the night's
      # update: the finished one is archived as a past season (scripts/rollover.mjs)
      - name: Roll over to a new season
        run: node scripts/rollover.mjs nfl --if-due

      # (the regular season, and once the playoffs have begun their own files beside it, the playoffs
      # and both together: *.post.json and *.all.json, the app's Stats From; none until then)
      - name: Pull game results from ESPN
        run: npm run update-data

      # The card's Roster tab: each team's depth chart, who's played and the injury report (nflverse, ESPN)
      - name: Build depth charts
        run: node apps/nfl/scripts/build-depth.mjs

      # The card's Field Map: where each player's throws, targets, runs and kicks went (nflverse's play-by-play;
      # a failed run keeps yesterday's file)
      - name: Build field maps
        run: node apps/nfl/scripts/build-field-maps.mjs || echo "field maps skipped"

      # (Wikipedia's staffs: a failed fetch keeps yesterday's file)
      - name: Build coaching staffs
        run: node apps/nfl/scripts/build-coaches.mjs || echo "coaches skipped"

      # (each finished game's highlights, kept for the game view before ESPN lets them go)
      - name: Keep game highlights
        env:
          # (optional: with a YouTube Data API key, every game is searched for, not only the channel's latest uploads)
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node libs/ranker/scripts/highlights.mjs nfl || echo "highlights skipped"

      # (the data checked before it's committed: a broken file stays out of master and off the site; npm test)
      - name: Install dependencies
        # (npm install, not npm ci: GitHub's npm wants lock entries ours resolves without; the lock is put back
        # as it was, so the commit step's pull --rebase sees a clean tree)
        run: |
          npm install
          git checkout -- package-lock.json

      - name: Check the data
        # (the live data's quality checks warn here, never block the commit; whether it's whole still does:
        # tests/support/live.mjs)
        env:
          LIVE_DATA_SOFT: "1"
        run: npm test

      - name: Commit updated data
        id: commit
        run: |
          git add apps/nfl/src/StaticData apps/nfl/scripts/update-data.mjs apps/nfl/src/sport/sport.ts
          if git diff --cached --quiet; then
            echo "No data changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update game data from ESPN"
          # (the model desk pushes hourly: a push that loses the race rebases onto it and tries again, three times)
          for attempt in 1 2 3; do
            if git pull --rebase && git push; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # (a rebase that stopped on a conflict let go of, so the next try starts clean)
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 10))
          done
          exit 1

  # (the site built and deployed after the commit, one deploy at a time across every workflow: deploy.yml)
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
