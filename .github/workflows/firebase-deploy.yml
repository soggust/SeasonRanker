name: Firebase Deploy

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  # Nothing deploys unless the test suite passes (the same suite ci.yml runs; ~30 seconds)
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        uses: ./.github/actions/npm-install

      - name: Run tests
        run: npm test

  # (built and deployed in the one queue every workflow's deploy waits in: deploy.yml)
  deploy:
    needs: test
    uses: ./.github/workflows/deploy.yml
    secrets:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
