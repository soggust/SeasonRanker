name: Model Desk - Bets

on:
  schedule:
    # Every hour, around the clock (24 runs a day; the repo is public, so its minutes are free). GitHub runs
    # scheduled workflows late, and sometimes skips them, so no single slot can be counted on; hourly, a late or
    # missed one costs little, and the West Coast's late games are graded overnight rather than the next
    # morning. The Odds API's credits stay within oddsapi.mjs's daily allowance however often it runs. Between them they reach every game before it starts (NFL early
    # and London kickoffs, MLB day games, the night's NBA, NHL and MLB) to bet it, and every game after it
    # starts to read its close and grade it (clv.mjs: ESPN keeps the close after kickoff, so the close is never
    # missed, only read later). At :17, off the top of the hour when GitHub's queue is longest. Each run grades
    # what finished, refits the ratings, the context and the trust, and bets every market (and the props) of
    # every game in the next two days it hasn't bet yet (libs/ranker/scripts/model/run.mjs). Code only: free.
    # (GitHub has been dropping most of these: the owner's computer kicks it too, hourly 8:05 AM to 11:05 PM
    # Central when none started in the last 45 minutes: the task "QBRanker desk kick", kick-update.mjs --desk)
    - cron: "17 * * * *"
    # (and tries aimed at the NFL's inactives: they post about 90 minutes before a kickoff and count only when a
    # run starts between about 90 and 35 minutes before it (the re-price comes after the fits, 20 minutes before
    # the start at the latest: libs/ranker/scripts/model/context.mjs LINEUP_HOURS). GitHub ran the hourly schedule
    # about five times a day in October 2026 (none in the 1:00 ET window on 10/11), so these add chances, no
    # promise. Each pair is EDT then EST: Sunday's 1:00 ET games, its 4:05/4:25 ET ones, and the night games
    # (Sunday, Monday, Thursday 8:15/8:20 ET). The Odds API's credits stay within the daily allowance as above)
    - cron: "45 15,16 * * 0"
    - cron: "57 18,19 * * 0"
    - cron: "55 22,23 * * 0,1,4"
  workflow_dispatch:
    inputs:
      replace:
        # (the open bets on games not started yet taken back and priced again with what the model knows now:
        # after a change to the model, its picks brought up to date)
        description: Re-price the open bets on games not started yet
        type: boolean
        default: false

# (one desk run at a time: a run that comes due while one is going waits; a second one due meanwhile
# replaces the waiting one, which is fine, as each run does all that's due. Its own group, not the data
# updates': GitHub keeps one waiting run a group, so in a shared group a desk run could cancel a waiting
# data update. Its commit rebases onto whatever they've pushed meanwhile.)
concurrency:
  group: model-desk
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  desk:
    runs-on: ubuntu-latest
    # (a run is about 15 to 25 minutes as of 2026-10-12 (the NFL props' fit alone about 12 here, 707s on the
    # 20:17 run: its late terms (the next man up, the injury return, the seasons' carryover's pl) adding replays;
    # the carryover's sk and rx no longer searched for it; the pull toward the middle searched only on passing TDs
    # and MLB hits, and the recalibration by side not tried: 792s to 721s locally), a cold one longer, the build
    # and deploy a few more: a hung source stops here, not after GitHub's 6 hours of runs queued behind it. Under 30 the margin to keep:
    # a late term never kept comes off the search, project.mjs)
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        # (the branch as it is when the job starts, not the commit it was queued at: a run that waited behind
        # another would start from data that run already moved on from, and its commit couldn't rebase)
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      # (the context's facts (context-<sport>.json), the players' lines, the summaries and anything else slow:
      # kept between runs; none of it is needed: a cold cache only makes the run slower, as it
      # asks for everything again)
      # (restored here, saved right after the bettor even when a later step fails: the re-price counts, the
      # lines resting and the Odds API's usage live in it, and a failed run mustn't lose them)
      - name: Restore the desk's cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/model
          key: model-desk-${{ github.run_id }}
          restore-keys: model-desk-

      # (the CHECKs' news research, libs/ranker/scripts/model/research.mjs: only with the repository variable
      # CHECK_RESEARCH set to 1 (and the ANTHROPIC_API_KEY secret); its SDK installed for it alone into .cache/sdk
      # (ai-budget.mjs loadSdk), apart from the repo's tree so it doesn't reify the whole monorepo, as the bettor
      # runs before the workflow's npm install. Not installed, the research is skipped, never the run. Off,
      # nothing here runs and nothing is spent. Its findings only label the CHECKs: never a bet)
      - name: Install the Anthropic SDK (CHECK research only)
        if: ${{ vars.CHECK_RESEARCH == '1' }}
        run: |
          npm install --prefix .cache/sdk --no-save --no-package-lock --no-audit --no-fund @anthropic-ai/sdk@0.131.0 || echo "::warning::the Anthropic SDK not installed: no CHECK research this run"

      - name: Grade, refit and bet
        env:
          # (the CHECKs' news research: off unless the variable is 1; under the desk's AI caps, ai-budget.mjs)
          CHECK_RESEARCH: ${{ vars.CHECK_RESEARCH }}
          ANTHROPIC_API_KEY: ${{ vars.CHECK_RESEARCH == '1' && secrets.ANTHROPIC_API_KEY || '' }}
          # (The Odds API: real lines and prices, props and history; without it the free ESPN board is used)
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # (the owner's notes on the picks, Firestore's deskNotes: read only, by its REST API, nothing to install;
          # without it, or on any failure, the desk runs without them: libs/ranker/scripts/model/notes.mjs)
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          REPLACE: ${{ inputs.replace && '--replace' || '' }}
        run: node libs/ranker/scripts/model/run.mjs $REPLACE

      # (Claude's analysis for the strong picks, libs/ranker/scripts/model/writeups.mjs: only with the repository
      # variable WRITEUPS set to on (off till the owner's measured run, writeups.mjs --validate) and the
      # ANTHROPIC_API_KEY secret; skipped quietly otherwise, and never failing the run (the plain write-ups
      # stay). After the bettor (its picks fresh), before the cache is saved (its calls are logged in the AI
      # usage log there, against the desk's caps) and before the data is checked (the picks it patches with it).
      # Its SDK installed for it alone into .cache/sdk, as the bettor's own. The day's and month's AI spend is
      # also committed (apps/nfl/scripts/model/ai-spend.json, by the commit step below), so a lost cache can't
      # reset the caps: ai-budget.mjs)
      - name: Write the strong bets' analyses
        continue-on-error: true
        timeout-minutes: 10
        env:
          WRITEUPS: ${{ vars.WRITEUPS || 'off' }}
          ANTHROPIC_API_KEY: ${{ vars.WRITEUPS == 'on' && secrets.ANTHROPIC_API_KEY || '' }}
          WRITEUP_EFFORT: ${{ vars.WRITEUP_EFFORT || 'high' }}
          WRITEUP_LEVELS: ${{ vars.WRITEUP_LEVELS || 'lock,high' }}
          WRITEUP_MAX_PER_RUN: ${{ vars.WRITEUP_MAX_PER_RUN || '12' }}
          WRITEUP_DAILY_USD: ${{ vars.WRITEUP_DAILY_USD || '1.50' }}
          WRITEUP_MONTHLY_USD: ${{ vars.WRITEUP_MONTHLY_USD || '25' }}
        run: |
          if [ "$WRITEUPS" != "on" ] || [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "Claude write-ups off (WRITEUPS=$WRITEUPS, or no ANTHROPIC_API_KEY): plain write-ups only"
            exit 0
          fi
          if [ ! -d .cache/sdk/node_modules/@anthropic-ai/sdk ]; then
            npm install --prefix .cache/sdk --no-save --no-package-lock --no-audit --no-fund @anthropic-ai/sdk@0.131.0 || { echo "::warning::the Anthropic SDK not installed: plain write-ups only"; exit 0; }
          fi
          node libs/ranker/scripts/model/writeups.mjs || echo "::warning::the write-ups step failed: plain write-ups only"

      - name: Save the desk's cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .cache/model
          key: model-desk-${{ github.run_id }}

      # (the data checked before it's committed: a broken ledger or state stays out of master)
      - name: Install dependencies
        # (npm install, not npm ci: GitHub's npm wants lock entries ours resolves without; the lock is put back
        # as it was, so the commit step's pull --rebase sees a clean tree)
        run: |
          npm install
          git checkout -- package-lock.json

      - name: Check the data
        run: npm test

      # (the desk's history, ledger, state and picks, each written only when something in it changed, so a run
      # that learned nothing new commits nothing; picks: whether the public Bets page's picks changed, the one
      # thing here the live site shows)
      - name: Commit the desk
        id: commit
        run: |
          git add apps/*/scripts/model apps/*/src/StaticData/model
          if git diff --cached --quiet; then
            echo "Nothing new"
            echo "picks=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --cached --name-only | grep -q 'src/StaticData/model/picks.json'; then
            echo "picks=true" >> "$GITHUB_OUTPUT"
          else
            echo "picks=false" >> "$GITHUB_OUTPUT"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Model desk: graded, refit, bet"
          # (a data update may have pushed meanwhile: rebase and try again, three times)
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep $((attempt * 10))
          done
          exit 1

      # ---- wallet (phase 2) ----
      # The users' play-money bets: each one on a game that's over settled from ESPN's final (won, lost, push,
      # or void with why), its winnings paid into its wallet, the leaderboards redone, the next days' lines
      # snapshotted for the price check (libs/ranker/scripts/accounts/settle.mjs, the Admin SDK). Free. Only
      # with the FIREBASE_SERVICE_ACCOUNT secret (skipped, quietly, without it), after the bettor (its ledgers
      # fresh), and never failing the desk's run
      - name: Settle the play bets
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "No FIREBASE_SERVICE_ACCOUNT secret: play bets not settled"
            exit 0
          fi
          node libs/ranker/scripts/accounts/settle.mjs
      # ---- end wallet ----

      # The public Bets page reads each sport's data/model/picks.json, served with the site: when the picks
      # changed, the site is built and deployed (pushes made with GITHUB_TOKEN don't trigger the Firebase
      # deploy workflow, so it's done here, as the data updates do). At most once a run, only when the picks
      # changed: up to one a run, fewer when the slate is quiet
      - name: Build project
        if: steps.commit.outputs.picks == 'true'
        run: npm run build

      - name: Install Firebase CLI
        if: steps.commit.outputs.picks == 'true'
        run: npm install -g firebase-tools

      - name: Deploy to Firebase
        if: steps.commit.outputs.picks == 'true'
        run: firebase deploy --token ${{ secrets.FIREBASE_TOKEN }}
