name: Model Desk - Bets

on:
  schedule:
    # Every hour, around the clock (24 runs a day; the repo is public, so its minutes are free). GitHub runs
    # scheduled workflows late, and sometimes skips them, so no single slot can be counted on; hourly, a late or
    # missed one costs little, and the West Coast's late games are graded overnight rather than the next
    # morning. The Odds API's credits stay within oddsapi.mjs's daily allowance however often it runs. Between them they reach every game before it starts (NFL early
    # and London kickoffs, MLB day games, the night's NBA, NHL and MLB) to bet it, and every game after it
    # starts to read its close and grade it (clv.mjs: ESPN keeps the close after kickoff, so the close is never
    # missed, only read later). At :17, off the top of the hour when GitHub's queue is longest. Each run grades
    # what finished, refits the ratings, the context and the trust, and bets every market (and the props) of
    # every game in the next two days it hasn't bet yet (libs/ranker/scripts/model/run.mjs). Code only: free.
    # (GitHub has been dropping most of these: the owner's computer kicks it too, hourly 8:05 AM to 11:05 PM
    # Central when none started in the last 45 minutes: the task "QBRanker desk kick", kick-update.mjs --desk)
    - cron: "17 * * * *"
    # (MMA, since 2026-10-16 (leagues.mjs mma, mma-desk.mjs): UFC cards fight on Saturdays, mostly 4 to 11 PM
    # ET, a bout's lines open 72 hours before it and its last chance is 4 hours, so the hourly schedule reaches
    # every card Wednesday through Saturday afternoon with several runs to spare. Its run is seconds (the fit
    # over the kept archive, no props), inside the bettor's step. Credits: one h2h ask of The Odds API for the
    # whole MMA board, 1 credit, on each run with a bout due, so a card costs about as many credits as runs land
    # in its three days (24 a day at most, 5 or so as GitHub has run it): 50 to 150 a card, 250 to 750 a month
    # over about 5 cards, out of the 20,000)
    # (and tries aimed at the NFL's inactives: they post about 90 minutes before a kickoff and count only when a
    # run starts between about 90 and 35 minutes before it (the re-price comes after the fits, 20 minutes before
    # the start at the latest: libs/ranker/scripts/model/context.mjs LINEUP_HOURS). GitHub ran the hourly schedule
    # about five times a day in October 2026 (none in the 1:00 ET window on 10/11), so these add chances, no
    # promise. Each pair is EDT then EST: Sunday's 1:00 ET games, its 4:05/4:25 ET ones, and the night games
    # (Sunday, Monday, Thursday 8:15/8:20 ET). The Odds API's credits stay within the daily allowance as above)
    - cron: "45 15,16 * * 0"
    - cron: "57 18,19 * * 0"
    - cron: "55 22,23 * * 0,1,4"
  workflow_dispatch:
    inputs:
      replace:
        # (the open bets on games not started yet taken back and priced again with what the model knows now:
        # after a change to the model, its picks brought up to date)
        description: Re-price the open bets on games not started yet
        type: boolean
        default: false
      reason:
        # (why this run was started, logged and nothing else: the owner's PC kicks the desk ahead of game windows
        # (apps/nfl/scripts/kick-update.mjs --desk-games, the scheduled task "QBRanker desk kick games": NBA fives
        # post about 30 minutes before the tip, NFL inactives 90 before the kickoff) and says which window; a kick by
        # hand says why. The concurrency group below queues a kick behind a running run, never cancels one)
        description: Why this run was started (logged)
        type: string
        default: ""

# (one desk run at a time: a run that comes due while one is going waits; a second one due meanwhile
# replaces the waiting one, which is fine, as each run does all that's due. Its own group, not the data
# updates': GitHub keeps one waiting run a group, so in a shared group a desk run could cancel a waiting
# data update. Its commit rebases onto whatever they've pushed meanwhile.)
concurrency:
  group: model-desk
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  desk:
    runs-on: ubuntu-latest
    # (a run is about 15 to 25 minutes as of 2026-10-12 (the NFL props' fit alone about 12 here, 707s on the
    # 20:17 run: its late terms (the next man up, the injury return, the seasons' carryover's pl) adding replays;
    # the carryover's sk and rx no longer searched for it; the pull toward the middle searched only on passing TDs
    # and MLB hits, and the recalibration by side not tried: 792s to 721s locally), a cold one longer, the build
    # and deploy a few more: a hung source stops here, not after GitHub's 6 hours of runs queued behind it. Under 30 the margin to keep:
    # a late term never kept comes off the search, project.mjs)
    # 2026-10-14: 45 wasn't enough. Every sport's props refit came to ~50 minutes on GitHub (NFL 1592s, NBA
    # 549s, NHL 347s), so the runs were cancelled before they committed, and their bets were lost with them.
    # 2026-10-15: the props' fits are kept between runs (libs/ranker/scripts/model/fitcache.mjs, in the desk's
    # cache below, .cache/model/fits): each sport's searched once a day (the first run from 6 AM Central), after a
    # slate of new finals, or when the fit's code or MODEL_EPOCH changed; the runs between rebuild its projections
    # from the saved fit in seconds. A run refits past its first sport only while its refitting stays under 20
    # minutes (fitPlan): the NFL's alone (~27 minutes here) or the other three's together; the rest wait a run (a
    # stale fit reused once more; one that can't be reused, no props that run). So a run is a few minutes, ~35 on
    # a refit of the NFL's.
    # 2026-10-15 audit: the bettor's own step has the 45 minutes now (and stops starting sports at 35,
    # DESK_DEADLINE_MIN), so a run that overruns still commits the sports it finished; the job's 70 leaves room
    # for the write-ups (10), the news (8), the tests and the commit after it. The deploy is its own job
    # (deploy.yml).
    timeout-minutes: 70
    outputs:
      picks: ${{ steps.commit.outputs.picks }}

    steps:
      # (a kicked run says why it was started: the dispatch input reason, the owner's PC's game-window kicks)
      - name: Why this run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reason != '' }}
        env:
          REASON: ${{ inputs.reason }}
        run: 'echo "Started by hand or by a kick: $REASON"'

      - name: Checkout repository
        uses: actions/checkout@v7
        # (the branch as it is when the job starts, not the commit it was queued at: a run that waited behind
        # another would start from data that run already moved on from, and its commit couldn't rebase)
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      # (the context's facts (context-<sport>.json), the players' lines, the summaries, the props' fits (fits/) and
      # anything else slow:
      # kept between runs; none of it is needed: a cold cache only makes the run slower, as it
      # asks for everything again)
      # (restored here, saved right after the bettor even when a later step fails: the re-price counts, the
      # lines resting and the Odds API's usage live in it, and a failed run mustn't lose them)
      - name: Restore the desk's cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/model
          key: model-desk-${{ github.run_id }}
          restore-keys: model-desk-

      # (the CHECKs' news research, libs/ranker/scripts/model/research.mjs: only with the repository variable
      # CHECK_RESEARCH set to 1 (and the ANTHROPIC_API_KEY secret); its SDK installed for it alone into .cache/sdk
      # (ai-budget.mjs loadSdk), apart from the repo's tree so it doesn't reify the whole monorepo, as the bettor
      # runs before the workflow's npm install. Not installed, the research is skipped, never the run. Off,
      # nothing here runs and nothing is spent. Its finding is the CHECK's judgment call: research.mjs verdictOf)
      - name: Install the Anthropic SDK (CHECK research only)
        if: ${{ vars.CHECK_RESEARCH == '1' }}
        run: |
          npm install --prefix .cache/sdk --no-save --no-package-lock --no-audit --no-fund @anthropic-ai/sdk@0.131.0 || echo "::warning::the Anthropic SDK not installed: no CHECK research this run"

      # (a sport that throws, or one the step's timeout stops, is put back as committed by the next step, and the
      # sports that finished are committed all the same; the job is failed at its end so the failure is seen:
      # run.mjs's running marks, .cache/model/running/<sport>)
      - name: Grade, refit and bet
        id: bet
        continue-on-error: true
        timeout-minutes: 45
        env:
          # (no sport started past this many minutes in: run.mjs)
          DESK_DEADLINE_MIN: "35"
          # (the CHECKs' news research: off unless the variable is 1; under its own caps, ai-budget.mjs
          # researchBudget: its dated schedule's (CAP_WINDOWS: through 2026-10-31 $100 on the 18th, then $8 a
          # day, $60 the month; else $4 a UTC day and $55 a UTC month: the miss review's share taken out of the
          # $10 / $100 and $5 / $80 they were), every sport, whichever binds first;
          # CHECK_RESEARCH_DAILY_USD / _MONTHLY_USD may lower them, never raise them. Every open CHECK, the
          # biggest model Kelly first, CHECK_RESEARCH_N a sport a day at most (100). Unset, each its default)
          CHECK_RESEARCH: ${{ vars.CHECK_RESEARCH }}
          ANTHROPIC_API_KEY: ${{ vars.CHECK_RESEARCH == '1' && secrets.ANTHROPIC_API_KEY || '' }}
          CHECK_RESEARCH_N: ${{ vars.CHECK_RESEARCH_N }}
          CHECK_RESEARCH_DAILY_USD: ${{ vars.CHECK_RESEARCH_DAILY_USD }}
          CHECK_RESEARCH_MONTHLY_USD: ${{ vars.CHECK_RESEARCH_MONTHLY_USD }}
          # (The Odds API: real lines and prices, props and history; without it the free ESPN board is used)
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # (the owner's notes on the picks, Firestore's deskNotes: read only, by its REST API, nothing to install;
          # without it, or on any failure, the desk runs without them: libs/ranker/scripts/model/notes.mjs)
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          REPLACE: ${{ inputs.replace && '--replace' || '' }}
        run: node libs/ranker/scripts/model/run.mjs $REPLACE

      # (a sport whose run didn't end well (its mark left: it threw, or the step's timeout stopped it mid-write):
      # its committed files put back as they were, so nothing half-done is committed; the Odds API's asks it made
      # stay counted in the cache, and an ask whose board never published is asked again: timing.mjs lostAsk)
      - name: Put back a failed sport's files
        if: ${{ !cancelled() }}
        run: |
          for mark in .cache/model/running/*; do
            [ -e "$mark" ] || continue
            sport=$(basename "$mark")
            rm -f "$mark"
            case "$sport" in nfl|nba|nhl|mlb|mma) ;; *) continue ;; esac
            echo "::warning::$sport: its run didn't finish: its files put back as committed, the other sports' kept"
            git checkout -- "apps/$sport/scripts/model" "apps/$sport/src/StaticData/model" || true
            git clean -fdq -- "apps/$sport/scripts/model" "apps/$sport/src/StaticData/model" || true
          done

      # (the morning odds snapshot, libs/ranker/scripts/model/odds-history.mjs morning (DECISIONS.md D29): once a
      # day from 10 AM Eastern, the first run then, every coming game's lines and the day's props at DraftKings and
      # Pinnacle into the priced history (apps/<sport>/scripts/model/odds-history/morning/<day>.jsonl.gz, committed
      # below); its own Odds API budget (oddsapi.mjs SNAPSHOT: 300 credits a day at most, the first cut when credits
      # run low). For history, learning and the gate only: the bettor never prices off it (D30). Never failing the
      # run. Before the cache is saved (its calls logged there))
      - name: Take the morning odds snapshot
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 6
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          node libs/ranker/scripts/model/odds-history.mjs morning || echo "::warning::the morning odds snapshot failed, none today"

      # (Claude's analysis for the strong picks, libs/ranker/scripts/model/writeups.mjs: only with the repository
      # variable WRITEUPS set to on (off till the owner's measured run, writeups.mjs --validate) and the
      # ANTHROPIC_API_KEY secret; skipped quietly otherwise, and never failing the run (the plain write-ups
      # stay). After the bettor (its picks fresh), before the cache is saved (its calls are logged in the AI
      # usage log there, against the desk's caps) and before the data is checked (the picks it patches with it).
      # Its SDK installed for it alone into .cache/sdk, as the bettor's own. The day's and month's AI spend is
      # also committed (apps/nfl/scripts/model/ai-spend.json, by the commit step below), so a lost cache can't
      # reset the caps: ai-budget.mjs)
      - name: Write the strong bets' analyses
        continue-on-error: true
        timeout-minutes: 10
        env:
          WRITEUPS: ${{ vars.WRITEUPS || 'off' }}
          ANTHROPIC_API_KEY: ${{ vars.WRITEUPS == 'on' && secrets.ANTHROPIC_API_KEY || '' }}
          WRITEUP_EFFORT: ${{ vars.WRITEUP_EFFORT || 'high' }}
          WRITEUP_LEVELS: ${{ vars.WRITEUP_LEVELS || 'lock,high' }}
          WRITEUP_MAX_PER_RUN: ${{ vars.WRITEUP_MAX_PER_RUN || '12' }}
          WRITEUP_DAILY_USD: ${{ vars.WRITEUP_DAILY_USD || '1.50' }}
          WRITEUP_MONTHLY_USD: ${{ vars.WRITEUP_MONTHLY_USD || '25' }}
        run: |
          if [ "$WRITEUPS" != "on" ] || [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "Claude write-ups off (WRITEUPS=$WRITEUPS, or no ANTHROPIC_API_KEY): plain write-ups only"
            exit 0
          fi
          if [ ! -d .cache/sdk/node_modules/@anthropic-ai/sdk ]; then
            npm install --prefix .cache/sdk --no-save --no-package-lock --no-audit --no-fund @anthropic-ai/sdk@0.131.0 || { echo "::warning::the Anthropic SDK not installed: plain write-ups only"; exit 0; }
          fi
          node libs/ranker/scripts/model/writeups.mjs || echo "::warning::the write-ups step failed: plain write-ups only"

      # (the teams' news read for role signals, libs/ranker/scripts/model/news-signals.mjs: only with the
      # repository variable NEWS_SIGNALS set to 1 and the ANTHROPIC_API_KEY secret; claude-haiku-5-5, a team once
      # a day (every run through 2026-10-31, ai-budget.mjs CAP_WINDOWS), each story once. Log only: the signals move no price, stake or CHECK (a later fit tests them). Its
      # own caps (ai-budget.mjs newsBudget: $1 a day and $10 through 2026-10-31, then $0.15 a day and $4 a month;
      # NEWS_SIGNALS_DAILY_USD / _MONTHLY_USD may lower them), its log committed with the desk (apps/*/scripts/model/
      # news-signals.json) and the Algorithm tab's summary (apps/*/src/StaticData/model/news-signals.json).
      # Before the cache is saved (its calls logged there) and never failing the run)
      - name: Read the teams' news for role signals
        continue-on-error: true
        timeout-minutes: 8
        env:
          NEWS_SIGNALS: ${{ vars.NEWS_SIGNALS || '0' }}
          ANTHROPIC_API_KEY: ${{ vars.NEWS_SIGNALS == '1' && secrets.ANTHROPIC_API_KEY || '' }}
          NEWS_SIGNALS_DAILY_USD: ${{ vars.NEWS_SIGNALS_DAILY_USD }}
          NEWS_SIGNALS_MONTHLY_USD: ${{ vars.NEWS_SIGNALS_MONTHLY_USD }}
          NEWS_SIGNALS_MAX_CALLS: ${{ vars.NEWS_SIGNALS_MAX_CALLS }}
        run: |
          if [ "$NEWS_SIGNALS" != "1" ] || [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "News signals off (NEWS_SIGNALS=$NEWS_SIGNALS, or no ANTHROPIC_API_KEY)"
            exit 0
          fi
          if [ ! -d .cache/sdk/node_modules/@anthropic-ai/sdk ]; then
            npm install --prefix .cache/sdk --no-save --no-package-lock --no-audit --no-fund @anthropic-ai/sdk@0.131.0 || { echo "::warning::the Anthropic SDK not installed: no news signals this run"; exit 0; }
          fi
          node libs/ranker/scripts/model/news-signals.mjs || echo "::warning::the news signals step failed: no signals this run"

      # (the daily miss review, libs/ranker/scripts/model/miss-review.mjs: each sport's biggest misses since its last
      # review (high confidence lost, the largest projection errors, the worst CLV losers; a broken premise left
      # out), 5 a sport plus 2 CLV losers, each looked into by claude-opus-5-5 with web search for its cause (a
      # fixed list), confidence and evidence. Once a UTC day a sport, from 12:00 UTC (after the night's grading):
      # sent as a Message Batch (half price) one run, read a later one; a run between only looks. Its own caps
      # (ai-budget.mjs missBudget: $2 a day and $40 through 2026-10-31, then $1 a day and $25 a month;
      # MISS_REVIEW_DAILY_USD / _MONTHLY_USD may lower them), its log committed with the desk (apps/*/scripts/model/
      # miss-review.json) and the Algorithm tab's panel (apps/*/src/StaticData/model/miss-review.json). On unless the
      # repository variable MISS_REVIEW is 0; needs the ANTHROPIC_API_KEY secret. Before the cache is saved (its
      # calls logged there, a paused turn's history kept there) and never failing the run)
      - name: Review the biggest misses
        continue-on-error: true
        timeout-minutes: 6
        env:
          MISS_REVIEW: ${{ vars.MISS_REVIEW || '1' }}
          ANTHROPIC_API_KEY: ${{ vars.MISS_REVIEW != '0' && secrets.ANTHROPIC_API_KEY || '' }}
          MISS_REVIEW_DAILY_USD: ${{ vars.MISS_REVIEW_DAILY_USD }}
          MISS_REVIEW_MONTHLY_USD: ${{ vars.MISS_REVIEW_MONTHLY_USD }}
        run: |
          if [ "$MISS_REVIEW" != "1" ] || [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "Miss review off (MISS_REVIEW=$MISS_REVIEW, or no ANTHROPIC_API_KEY)"
            exit 0
          fi
          if [ ! -d .cache/sdk/node_modules/@anthropic-ai/sdk ]; then
            npm install --prefix .cache/sdk --no-save --no-package-lock --no-audit --no-fund @anthropic-ai/sdk@0.131.0 || { echo "::warning::the Anthropic SDK not installed: no miss review this run"; exit 0; }
          fi
          node libs/ranker/scripts/model/miss-review.mjs || echo "::warning::the miss review step failed: none this run"

      - name: Save the desk's cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .cache/model
          key: model-desk-${{ github.run_id }}

      # (the data checked before it's committed: a broken ledger or state stays out of master)
      - name: Install dependencies
        # (npm install, not npm ci: GitHub's npm wants lock entries ours resolves without; the lock is put back
        # as it was, so the commit step's pull --rebase sees a clean tree)
        run: |
          npm install
          git checkout -- package-lock.json

      - name: Check the data
        # (the live data's quality checks warn here, never block the commit; whether it's whole still does:
        # tests/support/live.mjs. A write-up's length failed the commit on 2026-10-14 and lost its run's bets)
        env:
          LIVE_DATA_SOFT: "1"
        run: npm test

      # (the desk's history, ledger, state and picks, each written only when something in it changed, so a run
      # that learned nothing new commits nothing; picks: whether the public Bets page's picks changed, the one
      # thing here the live site shows)
      - name: Commit the desk
        id: commit
        run: |
          git add apps/*/scripts/model apps/*/src/StaticData/model
          if git diff --cached --quiet; then
            echo "Nothing new"
            echo "picks=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # (picks: said only once the push is in, so the deploy never goes ahead on a commit that didn't land)
          picks=false
          if git diff --cached --name-only | grep -q 'src/StaticData/model/picks.json'; then picks=true; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Model desk: graded, refit, bet"
          # (a data update may have pushed meanwhile: rebase and try again, three times)
          for attempt in 1 2 3; do
            if git pull --rebase && git push; then
              echo "picks=$picks" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # (a rebase that stopped on a conflict let go of, so the next try starts clean)
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 10))
          done
          exit 1

      # ---- wallet (phase 2) ----
      # The users' play-money bets: each one on a game that's over settled from ESPN's final (won, lost, push,
      # or void with why), its winnings paid into its wallet, the leaderboards redone, the next days' lines
      # snapshotted for the price check (libs/ranker/scripts/accounts/settle.mjs, the Admin SDK). Free. Only
      # with the FIREBASE_SERVICE_ACCOUNT secret (skipped, quietly, without it), after the bettor (its ledgers
      # fresh), and never failing the desk's run
      - name: Settle the play bets
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "No FIREBASE_SERVICE_ACCOUNT secret: play bets not settled"
            exit 0
          fi
          node libs/ranker/scripts/accounts/settle.mjs
      # ---- end wallet ----

      # (a sport's run that failed (the bettor's step: its outcome, though it doesn't stop the job) fails the job
      # here, after the rest is committed, so it's seen and GitHub's failure notice goes out)
      - name: Fail on a failed sport
        if: ${{ !cancelled() && steps.bet.outcome == 'failure' }}
        run: |
          echo "::error::the bettor's run failed (a sport threw, or the step's timeout): the sports that finished were committed; see its log"
          exit 1

  # The public Bets page reads each sport's data/model/picks.json, served with the site: when the picks changed
  # (and the commit landed), the site is built and deployed, one deploy at a time across every workflow
  # (deploy.yml). Even when the job then failed on a sport: what was committed is shown
  deploy:
    needs: desk
    if: ${{ !cancelled() && needs.desk.outputs.picks == 'true' }}
    uses: ./.github/workflows/deploy.yml
    secrets:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
