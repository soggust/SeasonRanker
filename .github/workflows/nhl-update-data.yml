name: NHL - Update Game Data

on:
  schedule:
    # Nightly at 11:37 UTC (6:37 AM CDT): after the last West Coast games are final and MoneyPuck has
    # posted the night. (Its own queue, see
    # concurrency). The 14:07 UTC run is a backup for a delayed or dropped one; a run with nothing new
    # (the offseason, or no games that night) is a no-op (no commit, no deploy).
    # Then every hour through the day (11:37 to 17:37 UTC): GitHub dropped both of these on 2026-10-14,
    # so the more tries the sooner one lands. This computer's task "QBRanker NFL data kick"
    # (apps/nfl/scripts/kick-update.mjs --sport=nhl) also starts it, off GitHub's timer altogether
    - cron: "37 11-17 * * *"
  workflow_dispatch:

# One update of this sport at a time: a run that starts while another is still going waits for it. Each sport
# its own queue (update-data-<sport>): GitHub keeps one waiting run a group and a newer one cancels it, so in one
# queue for every sport a sport's waiting run could be dropped for another's. They write apart (each its own
# apps/<sport>), their pushes rebase onto each other's, and their deploys wait in one queue (deploy.yml)
concurrency:
  group: update-data-nhl
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    # (a hung source stops the run, not six hours: the runs take 1-15 minutes)
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        # (the branch as it is when the job starts, not the commit it was queued at: a run that waited behind
        # another would start from data that run already moved on from, and its commit couldn't rebase)
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      # A new season that has begun (yesterday's games on ESPN) becomes current before the night's
      # update: the finished one is archived as a past season (scripts/rollover.mjs)
      - name: Roll over to a new season
        run: node scripts/rollover.mjs nhl --if-due

      # (the regular season, and from the first playoff game on the playoffs and both as well:
      # skill-players.post.json and .all.json; until then neither, last season's taken out)
      # (MoneyPuck's files, kept between runs: the shots file, ~20 MB, the season being played's downloaded again
      # after six hours (build-heat-maps.mjs FRESH_HOURS), not on every run; and the stats update's season files
      # (update-data.mjs moneypuck), asked every run, last time's copy standing in on a night the site hangs)
      - name: Restore the MoneyPuck cache
        uses: actions/cache@v6
        with:
          path: .cache/moneypuck
          key: nhl-moneypuck-${{ github.run_id }}
          restore-keys: nhl-moneypuck-

      - name: Pull NHL stats
        run: npm run nhl:update-data

      # The Overview's splash: how each team's season ended, each player's number and best game
      # (apps/nhl/scripts/build-splash.mjs; a failed run keeps yesterday's files, and says so on the run's page)
      - name: Build the splash's data
        run: node apps/nhl/scripts/build-splash.mjs || echo "::warning::Splash data not built (this step's log says why)"

      # The card's Heat Maps: every shot by zone on the rink (MoneyPuck's shots file; a failed run keeps
      # yesterday's files, and says so on the run's page)
      - name: Build heat maps
        run: node apps/nhl/scripts/build-heat-maps.mjs || echo "::warning::Heat maps not all built (this step's log says which season and why)"

      # (the highlights' YouTube upload pages and the day's search count, kept between runs: the daily search
      # cap holds across runs, and a run only pages back to what it's seen)
      - name: Restore the highlights cache
        uses: actions/cache@v6
        with:
          path: .cache/highlights
          key: nhl-highlights-${{ github.run_id }}
          restore-keys: nhl-highlights-

      # (each finished game's highlights, kept for the game view before ESPN lets them go)
      - name: Keep game highlights
        env:
          # (optional: with a YouTube Data API key, a game ESPN has no videos for is found on the league's YouTube channel)
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node libs/ranker/scripts/highlights.mjs nhl || echo "highlights skipped"

      # (the data checked before it's committed: a broken file stays out of master and off the site; npm test)
      - name: Install dependencies
        # (npm install, not npm ci: GitHub's npm wants lock entries ours resolves without; the lock is put back
        # as it was, so the commit step's pull --rebase sees a clean tree)
        uses: ./.github/actions/npm-install

      - name: Check the data
        # Whether the data is whole (data.test.mjs: it parses, every file and row has its fields) blocks the commit.
        # The rest of the suite checks the code, which ci.yml already gated on the push: run here on the night's
        # fresh data, a test that's too strict for it is a warning on the run's page, not a lost update (two such
        # failed the NFL and MLB updates on 2026-10-16). tests/support/live.mjs's checks warn as before
        env:
          LIVE_DATA_SOFT: "1"
        run: |
          node --test tests/data.test.mjs
          if ! npm test > test-run.log 2>&1; then
            grep -E "^not ok" test-run.log | sed "s/^/::warning::a code test failed on this run's data (not blocking): /" || true
            tail -n 40 test-run.log
          fi

      - name: Commit updated data
        id: commit
        run: |
          git add apps/nhl/src/StaticData apps/nhl/scripts/update-data.mjs apps/nhl/src/sport/sport.ts apps/nhl/scripts/coaches-cache.json
          if git diff --cached --quiet; then
            echo "No data changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update NHL data"
          # (the model desk pushes hourly: a push that loses the race rebases onto it and tries again, three times)
          for attempt in 1 2 3; do
            if git pull --rebase --autostash && git push; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # (a rebase that stopped on a conflict let go of, so the next try starts clean)
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 10))
          done
          exit 1

  # (the site built and deployed after the commit, one deploy at a time across every workflow: deploy.yml)
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
