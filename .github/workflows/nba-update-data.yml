name: NBA - Update Game Data

on:
  schedule:
    # Nightly at 11:17 UTC (6:17 AM CDT): after the last West Coast games are final and
    # Basketball-Reference has caught up. (Its own queue, see
    # concurrency). The 13:47 UTC run is a backup for a delayed or dropped one; a run with nothing new
    # (the offseason, or no games that night) is a no-op (no commit, no deploy).
    # Then every hour through the day (11:17 to 17:17 UTC): GitHub drops scheduled runs (2026-10-14 it
    # dropped the NHL's two), so the more tries the sooner one lands. This computer's task "QBRanker NFL
    # data kick" (apps/nfl/scripts/kick-update.mjs --sport=nba) also starts it, off GitHub's timer
    - cron: "17 11-17 * * *"
  workflow_dispatch:

# One update of this sport at a time: a run that starts while another is still going waits for it. Each sport
# its own queue (update-data-<sport>): GitHub keeps one waiting run a group and a newer one cancels it, so in one
# queue for every sport a sport's waiting run could be dropped for another's. They write apart (each its own
# apps/<sport>), their pushes rebase onto each other's, and their deploys wait in one queue (deploy.yml)
concurrency:
  group: update-data-nba
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    # (a hung source stops the run, not six hours: the runs take 1-15 minutes)
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        # (the branch as it is when the job starts, not the commit it was queued at: a run that waited behind
        # another would start from data that run already moved on from, and its commit couldn't rebase)
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      # (the Heat Maps' shots, each game's kept compactly between runs: the night reads only the new finals'
      # off the box scores' summaries, and a lost cache reads the season's again, about 1,300 requests;
      # apps/nba/scripts/shot-zones.mjs. Before the rollover, which builds the finished season's file from them)
      - name: Restore the shots cache
        uses: actions/cache@v6
        with:
          path: apps/nba/scripts/.cache/shots
          key: nba-shots-${{ github.run_id }}
          restore-keys: nba-shots-

      # A new season that has begun (yesterday's games on ESPN) becomes current before the night's
      # update: the finished one is archived as a past season (scripts/rollover.mjs)
      - name: Roll over to a new season
        run: node scripts/rollover.mjs nba --if-due

      # (the regular season, and once the playoffs have begun the playoffs and both too:
      # skill-players.post.json and .all.json; before then any old ones are removed; ESPN's box scores of the
      # games since the last run, for each team's vs Position: apps/nba/scripts/box-scores.mjs; and the Heat Maps'
      # heat-maps.json from the same games' shots: apps/nba/scripts/shot-zones.mjs)
      - name: Pull stats from Basketball-Reference and ESPN
        run: npm run nba:update-data

      # The Overview's splash: how each team's season ended, each player's number and best game
      # (apps/nba/scripts/build-splash.mjs; a failed run keeps yesterday's files, and says so on the run's page)
      - name: Build the splash's data
        run: node apps/nba/scripts/build-splash.mjs || echo "::warning::Splash data not built (this step's log says why)"

      # (Wikipedia's coaching staffs: a failed fetch keeps yesterday's file)
      - name: Build coaching staffs
        run: node apps/nba/scripts/build-coaches.mjs || echo "coaches skipped"

      # (the highlights' YouTube upload pages and the day's search count, kept between runs: the daily search
      # cap holds across runs, and a run only pages back to what it's seen)
      - name: Restore the highlights cache
        uses: actions/cache@v6
        with:
          path: .cache/highlights
          key: nba-highlights-${{ github.run_id }}
          restore-keys: nba-highlights-

      # (each finished game's highlights, kept for the game view before ESPN lets them go)
      - name: Keep game highlights
        env:
          # (optional: with a YouTube Data API key, a game ESPN has no videos for is found on the league's YouTube channel)
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node libs/ranker/scripts/highlights.mjs nba || echo "highlights skipped"

      # (the data checked before it's committed: a broken file stays out of master and off the site; npm test)
      - name: Install dependencies
        # (npm install, not npm ci: GitHub's npm wants lock entries ours resolves without; the lock is put back
        # as it was, so the commit step's pull --rebase sees a clean tree)
        run: |
          npm install
          git checkout -- package-lock.json

      - name: Check the data
        # Whether the data is whole (data.test.mjs: it parses, every file and row has its fields) blocks the commit.
        # The rest of the suite checks the code, which ci.yml already gated on the push: run here on the night's
        # fresh data, a test that's too strict for it is a warning on the run's page, not a lost update (two such
        # failed the NFL and MLB updates on 2026-10-16). tests/support/live.mjs's checks warn as before
        env:
          LIVE_DATA_SOFT: "1"
        run: |
          node --test tests/data.test.mjs
          if ! npm test > test-run.log 2>&1; then
            grep -E "^not ok" test-run.log | sed "s/^/::warning::a code test failed on this run's data (not blocking): /" || true
            tail -n 40 test-run.log
          fi

      - name: Commit updated data
        id: commit
        run: |
          # (the kept box scores too: the next run asks only for the games since, vs-position.mjs)
          git add apps/nba/src/StaticData apps/nba/scripts/box-scores apps/nba/scripts/update-data.mjs apps/nba/src/sport/sport.ts
          if git diff --cached --quiet; then
            echo "No data changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update NBA data"
          # (the model desk pushes hourly: a push that loses the race rebases onto it and tries again, three times)
          for attempt in 1 2 3; do
            if git pull --rebase && git push; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # (a rebase that stopped on a conflict let go of, so the next try starts clean)
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 10))
          done
          exit 1

  # (the site built and deployed after the commit, one deploy at a time across every workflow: deploy.yml)
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
